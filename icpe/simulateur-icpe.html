<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur ICPE - Batipro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.8;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title span {
      background: #1e3a5f;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* Activités prédéfinies */
    .activities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .activity-btn {
      padding: 12px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .activity-btn:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .activity-btn.selected {
      border-color: #3b82f6;
      background: #3b82f6;
      color: white;
    }

    .activity-btn .icon {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .activity-btn .label {
      font-size: 12px;
      font-weight: 600;
    }

    .activity-btn .rubrique {
      font-size: 10px;
      opacity: 0.7;
    }

    /* Formulaire */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 500px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    /* Bouton simuler */
    .btn-simulate {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-simulate:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-simulate:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Loading */
    .loading {
      display: none;
      text-align: center;
      padding: 30px;
    }

    .loading.visible {
      display: block;
    }

    .loading .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading p {
      color: #6b7280;
      font-size: 14px;
    }

    /* Résultat */
    .result {
      display: none;
    }

    .result.visible {
      display: block;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .regime-badge {
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
    }

    .regime-badge.autorisation {
      background: #fef2f2;
      color: #dc2626;
      border: 2px solid #fecaca;
    }

    .regime-badge.enregistrement {
      background: #fff7ed;
      color: #ea580c;
      border: 2px solid #fed7aa;
    }

    .regime-badge.declaration {
      background: #fefce8;
      color: #ca8a04;
      border: 2px solid #fef08a;
    }

    .regime-badge.non-icpe {
      background: #f0fdf4;
      color: #16a34a;
      border: 2px solid #bbf7d0;
    }

    .regime-badge.seveso {
      background: #fef2f2;
      color: #991b1b;
      border: 2px solid #dc2626;
    }

    .result-title {
      flex: 1;
    }

    .result-title h3 {
      font-size: 18px;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .result-title p {
      font-size: 13px;
      color: #6b7280;
    }

    .result-content {
      background: #f9fafb;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .result-content h4 {
      font-size: 14px;
      color: #1e3a5f;
      margin-bottom: 10px;
    }

    .result-content p {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .seuils-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 13px;
    }

    .seuils-table th,
    .seuils-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }

    .seuils-table th {
      background: #f3f4f6;
      font-weight: 600;
      color: #374151;
    }

    .seuils-table tr.current {
      background: #eff6ff;
    }

    .seuils-table tr.current td {
      color: #1d4ed8;
      font-weight: 600;
    }

    /* Liens documents */
    .documents {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .doc-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 15px;
      background: #1e3a5f;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .doc-link:hover {
      background: #2d5a87;
    }

    /* Reset button */
    .btn-reset {
      width: 100%;
      padding: 12px;
      background: white;
      color: #6b7280;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-reset:hover {
      background: #f9fafb;
    }

    /* Description libre */
    .or-separator {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin: 15px 0;
      position: relative;
    }

    .or-separator::before,
    .or-separator::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e5e7eb;
    }

    .or-separator::before { left: 0; }
    .or-separator::after { right: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏭 Simulateur ICPE</h1>
      <p>Déterminez le régime ICPE applicable à votre projet</p>
    </div>

    <!-- Étape 1 : Sélection activité -->
    <div class="card" id="step1">
      <div class="card-title">
        <span>1</span>
        Type d'activité
      </div>

      <div class="activities-grid">
        <button class="activity-btn" data-rubrique="1510" data-name="Entrepôt couvert">
          <div class="icon">📦</div>
          <div class="label">Entrepôt couvert</div>
          <div class="rubrique">Rubrique 1510</div>
        </button>
        <button class="activity-btn" data-rubrique="1530" data-name="Dépôt de papier/carton">
          <div class="icon">📄</div>
          <div class="label">Papier / Carton</div>
          <div class="rubrique">Rubrique 1530</div>
        </button>
        <button class="activity-btn" data-rubrique="1532" data-name="Dépôt de bois">
          <div class="icon">🪵</div>
          <div class="label">Bois</div>
          <div class="rubrique">Rubrique 1532</div>
        </button>
        <button class="activity-btn" data-rubrique="2910" data-name="Combustion">
          <div class="icon">🔥</div>
          <div class="label">Combustion</div>
          <div class="rubrique">Rubrique 2910</div>
        </button>
        <button class="activity-btn" data-rubrique="2921" data-name="Tours aéroréfrigérantes">
          <div class="icon">❄️</div>
          <div class="label">Réfrigération</div>
          <div class="rubrique">Rubrique 2921</div>
        </button>
        <button class="activity-btn" data-rubrique="2925" data-name="Ateliers de charge accumulateurs">
          <div class="icon">🔋</div>
          <div class="label">Charge batteries</div>
          <div class="rubrique">Rubrique 2925</div>
        </button>
        <button class="activity-btn" data-rubrique="1435" data-name="Stations-service">
          <div class="icon">⛽</div>
          <div class="label">Station-service</div>
          <div class="rubrique">Rubrique 1435</div>
        </button>
        <button class="activity-btn" data-rubrique="2560" data-name="Travail des métaux">
          <div class="icon">⚙️</div>
          <div class="label">Métaux</div>
          <div class="rubrique">Rubrique 2560</div>
        </button>
      </div>

      <div class="or-separator">OU décrivez librement l'activité</div>

      <div class="form-group">
        <textarea id="description" rows="3" placeholder="Ex: Entrepôt de stockage de produits cosmétiques, 15 000 m², stockage sur racks de 8m de haut..."></textarea>
      </div>
    </div>

    <!-- Étape 2 : Paramètres -->
    <div class="card" id="step2">
      <div class="card-title">
        <span>2</span>
        Paramètres du projet
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Surface du bâtiment (m²)</label>
          <input type="number" id="surface" placeholder="Ex: 5000">
        </div>
        <div class="form-group">
          <label>Hauteur sous plafond (m)</label>
          <input type="number" id="hauteur" placeholder="Ex: 10">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Volume total (m³)</label>
          <input type="number" id="volume" placeholder="Calculé automatiquement">
        </div>
        <div class="form-group">
          <label>Tonnage stocké (tonnes)</label>
          <input type="number" id="tonnage" placeholder="Ex: 2000">
        </div>
      </div>

      <div class="form-group">
        <label>Type de produits stockés</label>
        <input type="text" id="produits" placeholder="Ex: Matières combustibles, produits chimiques, denrées alimentaires...">
      </div>

      <div class="form-group">
        <label>Informations complémentaires</label>
        <textarea id="complement" rows="2" placeholder="Sprinklage prévu, présence de liquides inflammables, etc."></textarea>
      </div>
    </div>

    <!-- Bouton simulation -->
    <button class="btn-simulate" id="btnSimulate" onclick="simuler()">
      🤖 Analyser avec l'IA
    </button>

    <!-- Loading -->
    <div class="card loading" id="loading">
      <div class="spinner"></div>
      <p>Analyse en cours avec Gemini...</p>
    </div>

    <!-- Résultat -->
    <div class="card result" id="result">
      <div class="result-header">
        <div class="regime-badge" id="regimeBadge">-</div>
        <div class="result-title">
          <h3 id="rubriqueTitle">-</h3>
          <p id="rubriqueDesc">-</p>
        </div>
      </div>

      <div class="result-content">
        <h4>📋 Analyse détaillée</h4>
        <p id="analyseText">-</p>
      </div>

      <div class="result-content">
        <h4>📊 Seuils applicables</h4>
        <table class="seuils-table" id="seuilsTable">
          <thead>
            <tr>
              <th>Seuil</th>
              <th>Régime</th>
            </tr>
          </thead>
          <tbody id="seuilsBody">
          </tbody>
        </table>
      </div>

      <div class="documents" id="documents">
        <!-- Liens ajoutés dynamiquement -->
      </div>

      <button class="btn-reset" onclick="reset()">↩️ Nouvelle simulation</button>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = 'AIzaSyA99D6nApO2p9FTGTGzR6wxTc3PmmXBZSU';
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;

    // Base de données des URLs AIDA vérifiées
    const AIDA_URLS = {
      '1510': {
        fiche: 'https://aida.ineris.fr/reglementation/1510-stockage-matieres-produits-substances-combustibles-entrepots-couverts',
        arrete: 'https://aida.ineris.fr/reglementation/arrete-110417-relatif-prescriptions-generales-applicables-entrepots-couverts-soumis'
      },
      '1530': {
        fiche: 'https://aida.ineris.fr/reglementation/1530-depots-papiers-cartons-materiaux-combustibles-analogues',
        arrete: 'https://aida.ineris.fr/reglementation/arrete-150410-relatif-prescriptions-generales-applicables-depots-papier-carton'
      },
      '1532': {
        fiche: 'https://aida.ineris.fr/reglementation/1532-stockage-bois-materiaux-combustibles-analogues',
        arrete: 'https://aida.ineris.fr/reglementation/arrete-110913-relatif-prescriptions-generales-applicables-installations-relevant'
      },
      '1435': {
        fiche: 'https://aida.ineris.fr/reglementation/1435-stations-service-installations-ouvertes-non-public-carburants-sont-transferes',
        arrete: 'https://aida.ineris.fr/reglementation/arrete-150410-relatif-prescriptions-generales-applicables-stations-service-relevant'
      },
      '2910': {
        fiche: 'https://aida.ineris.fr/reglementation/2910-combustion-a-lexclusion-installations-visees-rubriques-2770-2771-2971-2931',
        arrete: 'https://aida.ineris.fr/reglementation/arrete-030818-relatif-installations-combustion-dune-puissance-thermique-nominale'
      },
      '2921': {
        fiche: 'https://aida.ineris.fr/thematiques/2921-installations-refroidissement-evaporation-deau-circuit-secondaire',
        arrete: null
      },
      '2925': {
        fiche: 'https://aida.ineris.fr/reglementation/2925-ateliers-charge-daccumulateurs-electriques',
        arrete: 'https://aida.ineris.fr/reglementation/arrete-290500-relatif-prescriptions-generales-applicables-installations-classees'
      },
      '2560': {
        fiche: 'https://aida.ineris.fr/thematiques/2560-travail-mecanique-metaux-alliages',
        arrete: null
      }
    };

    let selectedActivity = null;

    // Calcul auto du volume
    document.getElementById('surface').addEventListener('input', calcVolume);
    document.getElementById('hauteur').addEventListener('input', calcVolume);

    function calcVolume() {
      const surface = parseFloat(document.getElementById('surface').value) || 0;
      const hauteur = parseFloat(document.getElementById('hauteur').value) || 0;
      if (surface && hauteur) {
        document.getElementById('volume').value = surface * hauteur;
      }
    }

    // Sélection activité
    document.querySelectorAll('.activity-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.activity-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedActivity = {
          rubrique: btn.dataset.rubrique,
          name: btn.dataset.name
        };
      });
    });

    // Simulation
    async function simuler() {
      const description = document.getElementById('description').value;
      const surface = document.getElementById('surface').value;
      const hauteur = document.getElementById('hauteur').value;
      const volume = document.getElementById('volume').value;
      const tonnage = document.getElementById('tonnage').value;
      const produits = document.getElementById('produits').value;
      const complement = document.getElementById('complement').value;

      // Construire le contexte
      let contexte = '';
      if (selectedActivity) {
        contexte += `Activité sélectionnée: ${selectedActivity.name} (Rubrique ${selectedActivity.rubrique})\n`;
      }
      if (description) {
        contexte += `Description: ${description}\n`;
      }
      if (surface) contexte += `Surface: ${surface} m²\n`;
      if (hauteur) contexte += `Hauteur: ${hauteur} m\n`;
      if (volume) contexte += `Volume: ${volume} m³\n`;
      if (tonnage) contexte += `Tonnage: ${tonnage} tonnes\n`;
      if (produits) contexte += `Produits: ${produits}\n`;
      if (complement) contexte += `Compléments: ${complement}\n`;

      if (!contexte.trim()) {
        alert('Veuillez renseigner au moins une information sur le projet.');
        return;
      }

      // Afficher loading
      document.getElementById('loading').classList.add('visible');
      document.getElementById('result').classList.remove('visible');
      document.getElementById('btnSimulate').disabled = true;

      const prompt = `Tu es un expert en réglementation ICPE (Installations Classées pour la Protection de l'Environnement) en France.

Analyse le projet suivant et détermine:
1. La ou les rubriques ICPE applicables (numéro + intitulé)
2. Le régime applicable (Non ICPE, Déclaration, Enregistrement, Autorisation, ou Seveso)
3. Les seuils de la nomenclature pour cette rubrique
4. Une explication claire pour un commercial non-expert

Projet à analyser:
${contexte}

IMPORTANT: Réponds UNIQUEMENT avec un objet JSON valide (sans markdown, sans backticks), avec cette structure exacte:
{
  "rubrique": "1510",
  "intitule": "Stockage de matières combustibles en entrepôts couverts",
  "regime": "Enregistrement",
  "explication": "Votre entrepôt de 50 000 m³ stockant des matières combustibles...",
  "seuils": [
    {"seuil": "< 5 000 m³", "regime": "Non ICPE"},
    {"seuil": "5 000 - 50 000 m³", "regime": "Déclaration"},
    {"seuil": "50 000 - 300 000 m³", "regime": "Enregistrement"},
    {"seuil": "> 300 000 m³", "regime": "Autorisation"}
  ],
  "seuilActuel": "50 000 - 300 000 m³",
  "urlAida": "https://aida.ineris.fr/reglementation/1510-stockage-matieres-produits-substances-combustibles-entrepots-couverts",
  "documentsUtiles": [
    {"nom": "Arrêté du 11/04/17", "url": "https://aida.ineris.fr/reglementation/arrete-110417-prescriptions-generales-entrepots-couverts"}
  ],
  "alertes": ["Vérifier si présence de liquides inflammables (rubrique 1432)"]
}`;

      try {
        const response = await fetch(GEMINI_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: prompt }]
            }],
            generationConfig: {
              temperature: 0.2,
              maxOutputTokens: 2000
            }
          })
        });

        const data = await response.json();
        console.log('Réponse Gemini:', data);

        if (data.error) {
          throw new Error(data.error.message);
        }

        const textResponse = data.candidates[0].content.parts[0].text;
        console.log('Texte brut:', textResponse);

        // Parser le JSON (enlever les éventuels backticks)
        let jsonStr = textResponse.trim();
        if (jsonStr.startsWith('```json')) {
          jsonStr = jsonStr.slice(7);
        }
        if (jsonStr.startsWith('```')) {
          jsonStr = jsonStr.slice(3);
        }
        if (jsonStr.endsWith('```')) {
          jsonStr = jsonStr.slice(0, -3);
        }

        const result = JSON.parse(jsonStr.trim());
        afficherResultat(result);

      } catch (error) {
        console.error('Erreur:', error);
        alert('Erreur lors de l\'analyse: ' + error.message);
      } finally {
        document.getElementById('loading').classList.remove('visible');
        document.getElementById('btnSimulate').disabled = false;
      }
    }

    function afficherResultat(result) {
      // Badge régime
      const badge = document.getElementById('regimeBadge');
      badge.textContent = result.regime;
      badge.className = 'regime-badge ' + result.regime.toLowerCase().replace(' ', '-').replace('é', 'e');

      // Titre
      document.getElementById('rubriqueTitle').textContent = `Rubrique ${result.rubrique}`;
      document.getElementById('rubriqueDesc').textContent = result.intitule;

      // Analyse
      document.getElementById('analyseText').textContent = result.explication;

      // Alertes
      if (result.alertes && result.alertes.length > 0) {
        document.getElementById('analyseText').textContent += '\n\n⚠️ Points d\'attention:\n• ' + result.alertes.join('\n• ');
      }

      // Seuils
      const seuilsBody = document.getElementById('seuilsBody');
      seuilsBody.innerHTML = '';
      if (result.seuils) {
        result.seuils.forEach(s => {
          const tr = document.createElement('tr');
          if (s.seuil === result.seuilActuel) {
            tr.classList.add('current');
          }
          tr.innerHTML = `<td>${s.seuil}</td><td>${s.regime}</td>`;
          seuilsBody.appendChild(tr);
        });
      }

      // Documents - utiliser notre base de données vérifiée
      const docsDiv = document.getElementById('documents');
      docsDiv.innerHTML = '';

      // Récupérer les URLs depuis notre base de données
      const rubriqueNum = result.rubrique ? result.rubrique.toString().split('.')[0].split('-')[0].trim() : null;
      const aidaData = rubriqueNum ? AIDA_URLS[rubriqueNum] : null;

      // Lien AIDA principal (depuis notre base de données)
      if (aidaData && aidaData.fiche) {
        docsDiv.innerHTML += `<a href="${aidaData.fiche}" target="_blank" class="doc-link">📄 Fiche AIDA Rubrique ${rubriqueNum}</a>`;
      }

      // Arrêté ministériel (depuis notre base de données)
      if (aidaData && aidaData.arrete) {
        docsDiv.innerHTML += `<a href="${aidaData.arrete}" target="_blank" class="doc-link">📋 Arrêté ministériel</a>`;
      }

      // Recherche AIDA si rubrique non trouvée dans notre base
      if (!aidaData && rubriqueNum) {
        docsDiv.innerHTML += `<a href="https://aida.ineris.fr/recherche?search=${rubriqueNum}" target="_blank" class="doc-link">🔍 Rechercher sur AIDA</a>`;
      }

      // Lien PDF nomenclature (toujours disponible)
      docsDiv.innerHTML += `<a href="https://aida.ineris.fr/sites/default/files/2023-03/BrochureNom_v53public.pdf" target="_blank" class="doc-link">📚 Nomenclature complète (PDF)</a>`;

      document.getElementById('result').classList.add('visible');
    }

    function reset() {
      document.getElementById('result').classList.remove('visible');
      document.getElementById('description').value = '';
      document.getElementById('surface').value = '';
      document.getElementById('hauteur').value = '';
      document.getElementById('volume').value = '';
      document.getElementById('tonnage').value = '';
      document.getElementById('produits').value = '';
      document.getElementById('complement').value = '';
      document.querySelectorAll('.activity-btn').forEach(b => b.classList.remove('selected'));
      selectedActivity = null;
    }
  </script>
</body>
</html>
