<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connexion Batipro Concept">
  <title>Connexion — Batipro Concept</title>
  <link rel="stylesheet" href="/src/styles/home.css">
  <link rel="stylesheet" href="/src/auth/login.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">Batipro Concept</div>
    <h1>Connexion</h1>
    <p class="login-subtitle">Accédez à vos outils</p>

    <form id="login-form" class="login-form" autocomplete="on">
      <label class="login-field">
        <span>Email</span>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="vous@exemple.fr">
      </label>

      <label class="login-field">
        <span>Mot de passe</span>
        <input type="password" id="password" name="password" required autocomplete="current-password" minlength="8">
      </label>

      <div id="login-error" class="login-error" hidden></div>

      <button type="submit" id="login-submit" class="login-button">Se connecter</button>
    </form>
  </div>

  <script type="module" src="/src/auth/login.ts"></script>
</body>
</html>
